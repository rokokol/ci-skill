name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Automation (the bump cascade, drift bots) verifies branches by calling this workflow
  # against a ref — the real checks, never a copy of their commands that drifts apart
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Delete this step in a repository that has no version — see the versioning skill,
      # https://github.com/rokokol/versioning-skill, which owns that question and ships a
      # check-changelog.sh doing this and more. Spelled inline here because a workflow
      # cannot assume that skill is checked out anywhere.
      - name: VERSION matches CHANGELOG
        run: |
          ver=$(cat VERSION)
          grep -qF "## [$ver]" CHANGELOG.md || {
            echo "VERSION says $ver but CHANGELOG.md has no ## [$ver] heading" >&2
            exit 1
          }

      # >>> EXAMPLE: the repo's own build and test commands, tools taken from the
      # repo's lockfile (nix develop -c ... / npm ci / cargo --locked)
      - run: echo "build and test here"
      # <<<

  # A fast, separately-named status — lint answers in seconds next to a long build
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # Every vendored copy is byte-equal to its source: one edited here instead of at the
      # source fails by name — see .github/vendor.lock. Delete this step if the repo's own
      # gate already runs it
      - name: vendored copies are byte-equal to their source
        run: ./vendor-sync.sh check
      # Unpinned registry lookups make a job change behavior with zero change in the
      # repo; tools come from the lockfile, and check-pins.sh, vendored from the ci skill,
      # keeps it that way, proving on every run that it catches each shape it claims.
      # Delete this step if the repo's own gate already runs it
      - name: CI tools come from the lock, not the registry
        run: ./check-pins.sh
      # >>> EXAMPLE: run the build system's own lint check — the file list lives there,
      # not here (one source of truth per list)
      - run: echo "lint here"
      # <<<
