# A known-bad workflow: every line below resolves to whatever a registry serves that
# morning. check-templates.sh extracts the pin guard's own pattern from the build.yml
# template and demands that it matches here — a guard that has only ever been green
# may simply be matching nothing
name: unpinned
on: [push]
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - run: nix run nixpkgs#shfmt -- -d .
      - run: nix shell nixpkgs#actionlint -c actionlint
      - run: npx prettier@latest --check .
      - run: pip install ruff && ruff check .
      - run: go install github.com/x/tool@latest
