name: ci

# No mirrors, no :latest images — nothing here is a detector, so pull requests run it too
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # This skill tells every build workflow to take a ref, so a bot can verify a branch with
  # the real checks; it follows its own rule
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      # The pin guard runs inside check-templates.sh, on this file among others
      - name: check-templates.sh (self-testing lint)
        run: nix develop --no-write-lock-file -c ./check-templates.sh
