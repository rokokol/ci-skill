name: ci

# No mirrors, no :latest images — nothing here is a detector, so pull requests run it too
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: CI tools come from the lock, not the registry
        run: |
          if grep -rEn 'nix (run|shell) nixpkgs#|npx +[a-z@.-]|pip +install |go +install .*@latest' .github/workflows; then
            echo "unpinned registry lookup in a workflow — pin the tool in the flake's dev shell and use nix develop" >&2
            exit 1
          fi
      - name: check-templates.sh (self-testing lint)
        run: nix develop --no-write-lock-file -c ./check-templates.sh
